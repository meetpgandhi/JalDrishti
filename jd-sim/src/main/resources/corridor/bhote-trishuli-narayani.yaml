# --------------------------------------------------------------------------
# Reach wave speeds (calibrated from 26 August 2026)
# --------------------------------------------------------------------------
reaches:
  - from: RSW
    to: BTW
    distanceKm: 38      # [P] 36–40 km range; 38 is the model midpoint
    speedMinMps: 13.0   # [D] 36 km / 46 min
    speedMaxMps: 18.5   # [D] 40 km / 36 min
    notes: "Front at RSW 08:44; BTW lost 09:20–09:30 [P]"

  - from: BTW
    to: MLK
    distanceKm: 62      # [D]
    speedMinMps: 7.2    # [D] 62 km / 145 min
    speedMaxMps: 10.3   # [D] 62 km / 100 min
    notes: "BTW lost 09:20–09:30; MLK jump 11:10–11:43 [P]"

  - from: MLK
    to: MUG
    distanceKm: 32      # [A] distance approximate
    speedMinMps: 4.8    # [D] low confidence
    speedMaxMps: 6.9    # [D] low confidence
    notes: "MLK 11:10–11:43; Mugling ~13:00 [P]/[A]"

  - from: MUG
    to: DVG
    distanceKm: 36      # [A]
    speedMinMps: 6.0    # [A] low confidence
    speedMaxMps: 12.0   # [A] low confidence
    notes: "Mugling ~13:00; DVG rise from ~14:00 [A]"

