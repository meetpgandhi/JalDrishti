# Bhote Koshi – Trishuli – Narayani Corridor
# Rasuwagadi to Devghat, Nepal
# Sprint 0: River-km values [A] are placeholders until snapped to HydroSHEDS/OSM channel.
# [P] values come from the v3 specification and its cited sources.

