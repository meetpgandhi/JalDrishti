steps:
  # ─────────────────────────────────────────────────────────────
  # Step 1: Build multi-stage Docker container
  # ─────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/jaldrishti-service:latest'
      - '.'
    id: 'build-image'

  # ─────────────────────────────────────────────────────────────
  # Step 2: Push container image to Google Artifact Registry
  # ─────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/jaldrishti-service:latest'
    id: 'push-image'

  # ─────────────────────────────────────────────────────────────
  # Step 3: Deploy service to Google Cloud Run
  # ─────────────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/jaldrishti-service:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-env-vars=SPRING_PROFILES_ACTIVE=sim,JALDRISHTI_GEMINI_LOCATION=asia-south1,JALDRISHTI_GEMINI_MODEL=gemini-3.6-flash,JALDRISHTI_GEMINI_VERTEX_ENABLED=false'
    id: 'deploy-cloud-run'

substitutions:
  _REGION: 'asia-south1'
  _REPO_NAME: 'jaldrishti'
  _SERVICE_NAME: 'jaldrishti-core'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/jaldrishti-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY
