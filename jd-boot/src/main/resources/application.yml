server:
  port: 8080

spring:
  application:
    name: jaldrishti-core
  profiles:
    active: sim
  mvc:
    async:
      # Matches SseEmitter's own 30-min timeout in SseStreamController. Without this,
      # Spring MVC/Tomcat's much shorter default async timeout (~30s) cuts the SSE
      # stream before the emitter's own timeout, silently killing live console updates.
      request-timeout: 1800000

jaldrishti:
  corridor:
    name: "Bhote Koshi - Trishuli - Narayani"
    reporting-cadence-minutes: 10
    grace-before-silent-minutes: 3
    silence-sweep-interval-seconds: 60
    cascade-min-velocity-mps: 3.0
    cascade-max-velocity-mps: 35.0
  gemini:
    model: gemini-3.6-flash
    region: asia-south1
    location: asia-south1
    temperature: 0.0
    vertex-enabled: ${JALDRISHTI_GEMINI_VERTEX_ENABLED:false}
